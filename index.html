<!DOCTYPE html>
<html lang="ko">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cheat Arena</title>
<style>
:root{
  --amber:#e7a44a;
  --amber2:#ffd38f;
  --dark:#101214;
  --panel:#15191de8;
  --safeT:env(safe-area-inset-top,0px);
  --safeR:env(safe-area-inset-right,0px);
  --safeB:env(safe-area-inset-bottom,0px);
  --safeL:env(safe-area-inset-left,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0d0f;font-family:Arial,Helvetica,sans-serif;touch-action:none;overscroll-behavior:none}
button{font:inherit}
#game{position:fixed;inset:0;width:100vw;height:100vh;display:block;background:#111;touch-action:none}

.hidden{display:none!important}

#menu{
  position:fixed;z-index:50;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(390px,88vw);padding:24px;background:var(--panel);
  border:1px solid #9b6a32;box-shadow:0 14px 48px #000c;color:white
}
#menu h1{margin:0;color:var(--amber2);font-size:30px;letter-spacing:.08em}
#menu p{margin:5px 0 20px;color:#aaa}
.menuButton{
  display:block;width:100%;height:48px;margin:8px 0;
  border:1px solid #79552e;background:#24282b;color:#ddd;font-weight:bold
}
.menuButton.primary{background:#4a341e;color:var(--amber2);border-color:#c18440}
#serverText{font-size:12px;color:#888;margin-top:12px!important}

#weaponBar{
  position:fixed;z-index:25;top:calc(8px + var(--safeT));left:50%;transform:translateX(-50%);
  display:flex;gap:4px;padding:4px;background:#0b0d0fdf;border:1px solid #805526;
}
.weapon{
  height:48px;min-width:86px;padding:5px 10px;border:1px solid #5d4930;
  background:#202326;color:#c98b42;font-size:12px
}
.weapon b{display:block;color:#eee;font-size:11px;margin-bottom:4px}
.weapon.active{background:#594022;color:#ffd18a;border-color:#e09a46}

#leftHud{
  position:fixed;z-index:25;left:calc(12px + var(--safeL));bottom:calc(12px + var(--safeB));
  color:var(--amber);font-weight:700;text-shadow:0 2px 3px #000;font-size:14px;line-height:1.45
}
#topInfo{
  position:fixed;z-index:24;top:calc(69px + var(--safeT));left:50%;transform:translateX(-50%);
  color:white;text-align:center;text-shadow:0 2px 4px black;font-weight:bold;font-size:13px
}
#cheatHud{
  position:fixed;z-index:25;right:calc(12px + var(--safeR));bottom:calc(12px + var(--safeB));
  text-align:right;color:#ddd;text-shadow:0 2px 3px black;font-size:12px
}
.cheatOn{color:#ffbd63}

#crosshair{
  position:fixed;z-index:20;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);pointer-events:none
}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:#ffffffc0}
#crosshair:before{left:10px;top:2px;width:2px;height:18px}
#crosshair:after{left:2px;top:10px;width:18px;height:2px}

#touchUI{position:fixed;z-index:30;inset:0;pointer-events:none}
.stick{
  position:absolute;width:116px;height:116px;border-radius:50%;
  border:2px solid #ffffff3c;background:#0004;pointer-events:auto
}
.stickKnob{
  position:absolute;width:48px;height:48px;border-radius:50%;left:32px;top:32px;background:#ffffff78
}
#moveStick{left:calc(20px + var(--safeL));bottom:calc(25px + var(--safeB))}
.touchButton{
  position:absolute;pointer-events:auto;border-radius:10px;border:1px solid #ffffff58;
  background:#111c;color:white;font-weight:bold
}
#reloadButton{right:calc(126px + var(--safeR));bottom:calc(42px + var(--safeB));width:54px;height:45px}
#aimButton{right:calc(16px + var(--safeR));top:calc(77px + var(--safeT));width:64px;height:42px}
#espButton{right:calc(86px + var(--safeR));top:calc(77px + var(--safeT));width:64px;height:42px}
.touchButton.on{background:#70471d;border-color:#ffbd63}

#notice{
  position:fixed;z-index:80;left:50%;bottom:calc(18px + var(--safeB));transform:translateX(-50%);
  background:#000d;color:white;padding:8px 12px;border-radius:6px;font-size:12px;opacity:0;transition:opacity .15s;pointer-events:none
}
#notice.show{opacity:1}

#errorBox{
  position:fixed;z-index:100;left:10px;right:10px;bottom:10px;padding:10px;
  background:#7d1c1ce8;color:white;border:1px solid #ff8c8c;font:12px monospace;white-space:pre-wrap
}

@media(max-width:700px){
  #weaponBar{top:calc(5px + var(--safeT))}
  .weapon{min-width:72px;height:43px;font-size:10px;padding:4px 6px}
  #topInfo{top:calc(57px + var(--safeT));font-size:11px}
  #leftHud{font-size:12px;bottom:calc(150px + var(--safeB))}
  #cheatHud{display:none}
}
@media(orientation:portrait) and (pointer:coarse){
  .stick{width:100px;height:100px}
  .stickKnob{width:42px;height:42px;left:27px;top:27px}
}

#buildBadge{
  position:fixed;left:8px;top:8px;z-index:99999;
  padding:5px 8px;border:1px solid rgba(255,255,255,.25);
  border-radius:6px;background:rgba(0,0,0,.55);
  color:#fff;font:12px/1.2 monospace;pointer-events:none;
}


#healthBarWrap{
  position:fixed;left:16px;bottom:74px;z-index:60;width:min(250px,42vw);
  padding:9px 10px;background:rgba(10,12,13,.72);
  border:1px solid rgba(255,255,255,.18);border-radius:8px;pointer-events:none
}
#healthBarTop{display:flex;justify-content:space-between;align-items:center;color:#f2f2f2;font:700 13px Arial;margin-bottom:6px}
#healthBarValue{font-size:16px}
#healthBarTrack{height:14px;background:#292d2f;border:1px solid #61676a;border-radius:3px;overflow:hidden}
#healthBarFill{height:100%;width:100%;background:linear-gradient(90deg,#9e2d2d,#d5a03e);transition:width .1s linear}
@media(max-width:700px){
  #healthBarWrap{left:14px;bottom:108px;width:190px;padding:7px 9px}
  #healthBarTrack{height:11px}
}


#roundHud{
  position:fixed;top:92px;left:50%;transform:translateX(-50%);z-index:55;
  min-width:150px;text-align:center;padding:6px 12px;border-radius:8px;
  background:rgba(8,10,12,.56);border:1px solid rgba(255,255,255,.14);
  color:#fff;pointer-events:none
}
#roundTitle{font:800 13px Arial;letter-spacing:.08em}
#roundScore{font:900 21px Arial;margin-top:2px}
#roundRule{font:700 10px Arial;opacity:.65;letter-spacing:.12em;margin-top:1px}
#damageOverlay{
  position:fixed;inset:0;z-index:49;pointer-events:none;opacity:0;
  background:
    radial-gradient(circle at center, rgba(140,0,0,0) 28%, rgba(180,0,0,.18) 58%, rgba(140,0,0,.68) 100%);
  transition:opacity .07s linear
}
@media(max-width:700px){
  #roundHud{top:82px;padding:5px 9px;min-width:130px}
  #roundScore{font-size:18px}
}


#deathNotice{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  z-index:58;display:none;text-align:center;color:#fff;
  font:900 28px/1.05 Arial;letter-spacing:.08em;
  text-shadow:0 2px 6px #000;pointer-events:none
}
#deathNotice small{font-size:11px;opacity:.72;letter-spacing:.16em}
</style>
</head>
<body>

<div id="roundHud">
  <div id="roundTitle">ROUND 1</div>
  <div id="roundScore"><span id="blueRounds">0</span> : <span id="redRounds">0</span></div>
  <div id="roundRule">FIRST TO 5</div>
</div>
<div id="damageOverlay"></div>
<div id="deathNotice">ELIMINATED<br><small>WAIT FOR NEXT ROUND</small></div>


<div id="healthBarWrap">
  <div id="healthBarTop"><span>HEALTH</span><span id="healthBarValue">100</span></div>
  <div id="healthBarTrack"><div id="healthBarFill"></div></div>
</div>

<div id="buildBadge">BUILD 2026-09-01 NO-RESPAWN</div>


<canvas id="game"></canvas>

<div id="menu">
  <h1>CHEAT ARENA</h1>
  <p>5 VS 5 AI FPS · 5 WEAPONS</p>
  <button id="startAI" class="menuButton primary">AI 5v5 시작</button>
  <button id="online" class="menuButton">온라인 라운드전 (준비 중)</button>
  <p id="serverText">GitHub Pages 클라이언트 · Render 서버 미연결</p>
</div>

<div id="weaponBar" class="hidden">
  <button class="weapon active" data-w="0"><b>1</b>AR</button>
  <button class="weapon" data-w="1"><b>2</b>PISTOL</button>
  <button class="weapon" data-w="2"><b>3</b>KNIFE</button>
  <button class="weapon" data-w="3"><b>4</b>SHOTGUN</button>
  <button class="weapon" data-w="4"><b>5</b>CROSSBOW</button>
</div>

<div id="topInfo" class="hidden">BLUE 0 : 0 RED</div>

<div id="leftHud" class="hidden">
  <div id="hp">HEALTH 100</div>
  <div id="ammo">AR 30 / 30</div>
  <div id="kd">K/D 0 / 0</div>
</div>

<div id="cheatHud" class="hidden">
  <div id="aimState">F1 AIM OFF</div>
  <div id="espState">F2 ESP OFF</div>
</div>

<div id="crosshair" class="hidden"></div>

<div id="touchUI" class="hidden">
  <div id="moveStick" class="stick"><div class="stickKnob"></div></div>
  <button id="reloadButton" class="touchButton">R</button>
  <button id="aimButton" class="touchButton">AIM</button>
  <button id="espButton" class="touchButton">ESP</button>
</div>

<div id="notice"></div>
<div id="errorBox" class="hidden"></div>

<script>
"use strict";

window.addEventListener("error", e => {
  const box = document.getElementById("errorBox");
  box.classList.remove("hidden");
  box.textContent = "GAME ERROR\\n" + (e.message || "Unknown error") +
    (e.filename ? "\\n" + e.filename + ":" + e.lineno : "");
});

const $ = id => document.getElementById(id);
const canvas = $("game");
const ctx = canvas.getContext("2d");
if (!ctx) throw new Error("Canvas 2D context unavailable.");

const ui = {
  menu:$("menu"), startAI:$("startAI"), online:$("online"),
  weaponBar:$("weaponBar"), topInfo:$("topInfo"), leftHud:$("leftHud"),
  cheatHud:$("cheatHud"), crosshair:$("crosshair"), touchUI:$("touchUI"),
  hp:$("hp"), ammo:$("ammo"), kd:$("kd"), aimState:$("aimState"), espState:$("espState"),
  reload:$("reloadButton"), aim:$("aimButton"), esp:$("espButton"),
  notice:$("notice")
};

const coarse = window.matchMedia && window.matchMedia("(pointer:coarse)").matches;
const TOUCH = (navigator.maxTouchPoints || 0) > 0 && coarse;

const TILE = 64;
const FOV = Math.PI / 3;
const TWO_PI = Math.PI * 2;

const MAP = [
"####################",
"#..................#",
"#..................#",
"#....##............#",
"#....##......##....#",
"#............##....#",
"#..................#",
"#.......###........#",
"#.......###........#",
"#..................#",
"#..##..............#",
"#..##.......###....#",
"#...........###....#",
"#..................#",
"#......##..........#",
"#......##..........#",
"#..................#",
"####################"
];

const WEAPONS = [
  {name:"AR", damage:22, rate:7.5, mag:30, range:720, spread:.075, type:"hitscan"},
  {name:"PISTOL", damage:40, rate:3.2, mag:12, range:620, spread:.065, type:"hitscan"},
  {name:"KNIFE", damage:70, rate:1.8, mag:999, range:78, spread:.70, type:"melee"},
  {name:"SHOTGUN", damage:15, rate:1.05, mag:6, range:390, spread:.24, type:"shotgun", pellets:8},
  {name:"CROSSBOW", damage:95, rate:.72, mag:1, range:980, spread:.035, type:"projectile"}
];

const player = {
  x:2.5*TILE, y:2.5*TILE, a:0,
  hp:100, team:0, weapon:0, ammo:[30,12,999,6,1],
  nextShot:0, kills:0, deaths:0, alive:true
};

const blueSpawn = [[3,2],[2,4],[4,3],[3,5]];
const redSpawn = [[16,14],[15,15],[17,13],[15,12],[17,15]];

function botAt(pos, team, name){
  return {x:pos[0]*TILE,y:pos[1]*TILE,a:0,hp:100,team,name,nextShot:0,alive:true,strafe:Math.random()<.5?-1:1,think:0,wander:Math.random()*TWO_PI};
}
const bots = [
  botAt(blueSpawn[0],0,"BLUE-2"),
  botAt(blueSpawn[1],0,"BLUE-3"),
  botAt(blueSpawn[2],0,"BLUE-4"),
  botAt(blueSpawn[3],0,"BLUE-5"),
  botAt(redSpawn[0],1,"RED-1"),
  botAt(redSpawn[1],1,"RED-2"),
  botAt(redSpawn[2],1,"RED-3"),
  botAt(redSpawn[3],1,"RED-4"),
  botAt(redSpawn[4],1,"RED-5")
];

let running = false;
let aimOn = false;
let espOn = false;
let scoreB = 0;
let scoreR = 0;
let firing = false;
let last = performance.now();
let gameTime = 0;
const keys = Object.create(null);
const moveJoy = {x:0,y:0};
let recoilPitch = 0;
let recoilKick = 0;
let recoilSide = 0;
let muzzleFlash = 0;
let hitMarker = 0;
const bolts = [];
const impacts = [];
const bloodFx = [];
let damageFlash = 0;
let blueRoundWins = 0;
let redRoundWins = 0;
let roundNumber = 1;
let roundOver = false;
let roundRestartAt = 0;
const ROUNDS_TO_WIN = 5;

let touchLookId = null;
let touchLookX = 0;
let touchLookY = 0;

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, Math.floor(innerWidth*dpr));
  canvas.height = Math.max(1, Math.floor(innerHeight*dpr));
  canvas.style.width = innerWidth+"px";
  canvas.style.height = innerHeight+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize", resize, {passive:true});
resize();

function notify(text){
  ui.notice.textContent = text;
  ui.notice.classList.add("show");
  clearTimeout(notify.t);
  notify.t = setTimeout(()=>ui.notice.classList.remove("show"),1400);
}

function wall(x,y){
  const gx = Math.floor(x/TILE);
  const gy = Math.floor(y/TILE);
  if (gy < 0 || gx < 0 || gy >= MAP.length || gx >= MAP[0].length) return true;
  return MAP[gy][gx] === "#";
}

function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
function angle(a,b){ return Math.atan2(b.y-a.y,b.x-a.x); }
function norm(a){
  while(a > Math.PI) a -= TWO_PI;
  while(a < -Math.PI) a += TWO_PI;
  return a;
}

function moveEnt(e,dx,dy){
  const r = 9;
  if(!wall(e.x+dx+Math.sign(dx)*r,e.y)) e.x += dx;
  if(!wall(e.x,e.y+dy+Math.sign(dy)*r)) e.y += dy;
}

function los(a,b){
  const d = dist(a,b);
  for(let i=10;i<d;i+=10){
    const t=i/d;
    if(wall(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t)) return false;
  }
  return true;
}

function enemyList(team){
  if(team===0) return bots.filter(b=>b.team===1 && b.alive);
  return [player,...bots.filter(b=>b.team===0)].filter(e=>e.alive);
}

function spawnEntity(e){
  let p;
  if(e===player){
    p=[2.5,2.5];
  }else{
    const list = e.team===0 ? blueSpawn : redSpawn;
    p=list[Math.floor(Math.random()*list.length)];
  }
  e.x=p[0]*TILE;
  e.y=p[1]*TILE;
  e.hp=100;
  e.alive=true;
  if(e===player) player.ammo=[30,12,999,6,1];
}

function killEntity(victim,killer){
  if(!victim.alive) return;
  victim.alive=false;
  victim.hp=0;
  const team = killer===player ? 0 : killer.team;
  if(team===0) scoreB++; else scoreR++;
  if(killer===player) player.kills++;
  if(victim===player) player.deaths++;

  checkRoundEnd();
}


function spawnBlood(target){
  if(!target) return;
  for(let i=0;i<8;i++){
    const a=Math.random()*TWO_PI, sp=18+Math.random()*52;
    bloodFx.push({
      x:target.x,y:target.y,
      vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:.28+Math.random()*.28
    });
  }
}

function resetEntityForRound(e, spawn){
  e.alive=true;
  e.hp=100;
  e.x=spawn[0]*TILE;
  e.y=spawn[1]*TILE;
  e.nextShot=0;
}

function updateRoundHud(){
  const br=document.getElementById("blueRounds");
  const rr=document.getElementById("redRounds");
  const rt=document.getElementById("roundTitle");
  if(br) br.textContent=blueRoundWins;
  if(rr) rr.textContent=redRoundWins;
  if(rt) rt.textContent=`ROUND ${roundNumber}`;
}

function beginNextRound(){
  roundOver=false;
  player.hp=100; player.alive=true;
  player.x=3*TILE; player.y=3*TILE; player.a=0;
  player.ammo=[30,12,999,6,1];
  player.nextShot=0;

  let bi=0, ri=0;
  for(const b of bots){
    const spawn=b.team===0 ? blueSpawn[bi++ % blueSpawn.length] : redSpawn[ri++ % redSpawn.length];
    resetEntityForRound(b,spawn);
  }
  bolts.length=0; impacts.length=0; bloodFx.length=0;
  updateRoundHud();
  notify(`ROUND ${roundNumber}`);
}

function finishMatch(winnerTeam){
  roundOver=true;
  const msg=winnerTeam===0?"BLUE TEAM WINS":"RED TEAM WINS";
  notify(msg);
  setTimeout(()=>{
    blueRoundWins=0; redRoundWins=0; roundNumber=1;
    beginNextRound();
  },1800);
}

function finishRound(winnerTeam){
  if(roundOver) return;
  roundOver=true;
  if(winnerTeam===0) blueRoundWins++; else redRoundWins++;
  updateRoundHud();

  if(blueRoundWins>=ROUNDS_TO_WIN || redRoundWins>=ROUNDS_TO_WIN){
    finishMatch(winnerTeam);
    return;
  }

  notify(winnerTeam===0 ? "BLUE ROUND WIN" : "RED ROUND WIN");
  roundNumber++;
  roundRestartAt=gameTime+1.6;
}

function checkRoundEnd(){
  if(roundOver) return;
  const blueAlive=(player.alive?1:0)+bots.filter(b=>b.team===0&&b.alive).length;
  const redAlive=bots.filter(b=>b.team===1&&b.alive).length;
  if(redAlive===0) finishRound(0);
  else if(blueAlive===0) finishRound(1);
}

function damageTarget(target,amount,shooter){
  if(!target || !target.alive) return;
  target.hp-=amount;
  spawnBlood(target);
  if(shooter===player) hitMarker=.12;
  if(target===player){
    damageFlash=Math.min(1,damageFlash+.75);
  }
  if(target.hp<=0) killEntity(target,shooter);
}

function bestTargetInCone(shooter,range,spread,angleOffset=0){
  let best=null,bestScore=Infinity;
  const baseA=shooter.a+angleOffset;
  for(const t of enemyList(shooter===player?0:shooter.team)){
    const d=dist(shooter,t);
    if(d>range || !los(shooter,t)) continue;
    const da=Math.abs(norm(angle(shooter,t)-baseA));
    if(da>spread) continue;
    const s=da+d/12000;
    if(s<bestScore){best=t;bestScore=s;}
  }
  return best;
}

function fireBolt(shooter,w){
  const speed=620;
  bolts.push({
    x:shooter.x+Math.cos(shooter.a)*18,
    y:shooter.y+Math.sin(shooter.a)*18,
    vx:Math.cos(shooter.a)*speed,
    vy:Math.sin(shooter.a)*speed,
    team:shooter===player?0:shooter.team,
    owner:shooter,
    life:1.7,
    damage:w.damage
  });
}

function shoot(shooter,wIndex){
  if(!shooter.alive) return;
  const w=WEAPONS[wIndex];
  if(!w || gameTime < shooter.nextShot) return;

  if(shooter===player && wIndex!==2 && player.ammo[wIndex]<=0){
    notify("탄약 없음");
    return;
  }

  shooter.nextShot=gameTime+1/w.rate;

  if(shooter===player){
    if(wIndex!==2) player.ammo[wIndex]--;

    const recoilTable=[.018,.052,.025,.095,.070];
    const kickTable=[.42,.75,.32,1.25,.90];
    const sideTable=[.010,.018,.006,.032,.012];
    recoilPitch=Math.min(.24,recoilPitch+recoilTable[wIndex]);
    recoilKick=Math.min(1.35,recoilKick+kickTable[wIndex]);
    recoilSide+=(Math.random()-.5)*sideTable[wIndex];
    player.a+=recoilSide;
    muzzleFlash = wIndex===2 ? 0 : .075;
  }

  if(w.type==="shotgun"){
    for(let p=0;p<w.pellets;p++){
      const off=(Math.random()-.5)*w.spread*2;
      const target=bestTargetInCone(shooter,w.range,.055,off);
      if(target) damageTarget(target,w.damage,shooter);
    }
    return;
  }

  if(w.type==="projectile"){
    fireBolt(shooter,w);
    return;
  }

  const best=bestTargetInCone(shooter,w.range,w.spread);
  if(best) damageTarget(best,w.damage,shooter);
}

function reload(){
  if(player.weapon!==2){
    player.ammo[player.weapon]=WEAPONS[player.weapon].mag;
    notify(player.weapon===4 ? "석궁 장전" : "재장전");
  }
}

function selectWeapon(i){
  player.weapon=Math.max(0,Math.min(WEAPONS.length-1,i));
  document.querySelectorAll(".weapon").forEach((b,n)=>b.classList.toggle("active",n===player.weapon));
}

function toggleAim(){
  aimOn=!aimOn;
  ui.aim.classList.toggle("on",aimOn);
}
function toggleEsp(){
  espOn=!espOn;
  ui.esp.classList.toggle("on",espOn);
}

function startGame(){
  running=true;
  ui.menu.classList.add("hidden");
  ui.weaponBar.classList.remove("hidden");
  ui.topInfo.classList.remove("hidden");
  ui.leftHud.classList.remove("hidden");
  ui.cheatHud.classList.remove("hidden");
  ui.crosshair.classList.remove("hidden");
  if(TOUCH) ui.touchUI.classList.remove("hidden");
  player.kills=player.deaths=scoreB=scoreR=0;
  spawnEntity(player);
  bots.forEach(spawnEntity);
  notify("AI 5v5 시작");
}
ui.startAI.addEventListener("click",startGame);
ui.online.addEventListener("click",()=>notify("Render 서버 붙인 뒤 활성화 예정"));

function updatePlayer(dt){
  if(!player.alive) return;
  if(!player.alive) return;
  let f=0,s=0;
  if(TOUCH){
    f=-moveJoy.y;
    s=moveJoy.x;
  }else{
    f=(keys["w"]?1:0)-(keys["s"]?1:0);
    s=(keys["d"]?1:0)-(keys["a"]?1:0);
  }

  if(aimOn){
    const target=enemyList(0).filter(e=>los(player,e)).sort((a,b)=>dist(player,a)-dist(player,b))[0];
    if(target) player.a += norm(angle(player,target)-player.a)*Math.min(1,dt*11);
  }

  recoilPitch *= Math.pow(0.0015, dt);
  recoilKick *= Math.pow(0.002, dt);
  recoilSide *= Math.pow(0.01, dt);
  muzzleFlash=Math.max(0,muzzleFlash-dt);
  hitMarker=Math.max(0,hitMarker-dt);
  damageFlash=Math.max(0,damageFlash-dt*2.6);
  const dmg=document.getElementById("damageOverlay");
  if(dmg) dmg.style.opacity=String(Math.min(.82,damageFlash));

  const l=Math.hypot(f,s);
  if(l>1){f/=l;s/=l;}
  const speed=150;
  const dx=(Math.cos(player.a)*f+Math.cos(player.a+Math.PI/2)*s)*speed*dt;
  const dy=(Math.sin(player.a)*f+Math.sin(player.a+Math.PI/2)*s)*speed*dt;
  moveEnt(player,dx,dy);
  if(firing) shoot(player,player.weapon);
}

function updateBloodFx(dt){
  for(let i=bloodFx.length-1;i>=0;i--){
    const p=bloodFx[i];
    p.life-=dt;
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.vx*=Math.pow(.08,dt);
    p.vy*=Math.pow(.08,dt);
    if(p.life<=0) bloodFx.splice(i,1);
  }
}

function updateProjectiles(dt){
  for(let i=bolts.length-1;i>=0;i--){
    const b=bolts[i];
    b.life-=dt;
    const ox=b.x, oy=b.y;
    b.x+=b.vx*dt;
    b.y+=b.vy*dt;

    if(b.life<=0 || wall(b.x,b.y)){
      impacts.push({x:b.x,y:b.y,life:.35});
      bolts.splice(i,1);
      continue;
    }

    const targets=b.team===0 ? bots.filter(e=>e.team===1&&e.alive) : [player,...bots.filter(e=>e.team===0&&e.alive)];
    let hit=null;
    for(const t of targets){
      if(Math.hypot(t.x-b.x,t.y-b.y)<14){hit=t;break;}
    }
    if(hit){
      damageTarget(hit,b.damage,b.owner);
      impacts.push({x:b.x,y:b.y,life:.28});
      bolts.splice(i,1);
    }
  }
  for(let i=impacts.length-1;i>=0;i--){
    impacts[i].life-=dt;
    if(impacts[i].life<=0) impacts.splice(i,1);
  }
}

function updateBots(dt){
  for(const b of bots){
    if(!b.alive) continue;
    b.think -= dt;
    const es=enemyList(b.team);
    if(!es.length) continue;
    es.sort((a,z)=>dist(b,a)-dist(b,z));
    const t=es[0];
    const d=dist(b,t);
    const sees=los(b,t);

    if(b.think<=0){
      b.think=.45+Math.random()*.85;
      if(Math.random()<.55) b.strafe*=-1;
      b.wander += (Math.random()-.5)*1.8;
    }

    const targetA=angle(b,t);
    if(sees) b.a += norm(targetA-b.a)*Math.min(1,dt*6);
    else b.a += norm(b.wander-b.a)*Math.min(1,dt*2.4);

    let forward = d>190 ? 1 : d<105 ? -.65 : .15;
    let strafe = sees ? b.strafe*.72 : b.strafe*.28;
    const speed = sees ? 82 : 64;
    let dx=(Math.cos(b.a)*forward+Math.cos(b.a+Math.PI/2)*strafe)*speed*dt;
    let dy=(Math.sin(b.a)*forward+Math.sin(b.a+Math.PI/2)*strafe)*speed*dt;

    const ox=b.x, oy=b.y;
    moveEnt(b,dx,dy);
    if(Math.hypot(b.x-ox,b.y-oy)<.15){
      b.strafe*=-1;
      b.wander += Math.PI*(.35+Math.random()*.65);
      b.a=b.wander;
    }

    if(sees && d<560) shoot(b,0);
  }
}

function renderWorld(){
  const w=innerWidth,h=innerHeight;

  const horizon = h/2 + recoilPitch*h*1.9;

  const sky=ctx.createLinearGradient(0,0,0,horizon);
  sky.addColorStop(0,"#33414d");
  sky.addColorStop(1,"#87949b");
  ctx.fillStyle=sky;
  ctx.fillRect(0,0,w,horizon);

  const floor=ctx.createLinearGradient(0,horizon,0,h);
  floor.addColorStop(0,"#42484b");
  floor.addColorStop(1,"#17191b");
  ctx.fillStyle=floor;
  ctx.fillRect(0,horizon,w,h-horizon);

  // subtle floor perspective lines
  ctx.strokeStyle="rgba(255,255,255,.045)";
  ctx.lineWidth=1;
  for(let i=1;i<9;i++){
    const yy=horizon+(h-horizon)*(i*i/81);
    ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(w,yy);ctx.stroke();
  }

  if(!running) return;

  const step = w > 900 ? 2 : 3;
  for(let x=0;x<w;x+=step){
    const ra=player.a-FOV/2+(x/w)*FOV;
    let d=2;
    while(d<1400){
      if(wall(player.x+Math.cos(ra)*d,player.y+Math.sin(ra)*d)) break;
      d+=5;
    }
    d*=Math.cos(ra-player.a);
    const wh=Math.min(h*1.6,(h*TILE)/Math.max(d,1));
    const shade=Math.max(35,185-d*.11)|0;
    ctx.fillStyle=`rgb(${shade},${shade},${shade})`;
    ctx.fillRect(x,horizon-wh/2,step+1,wh);
    if((Math.floor(x/step)+Math.floor(d/70))%7===0){
      ctx.fillStyle="rgba(255,255,255,.055)";
      ctx.fillRect(x,horizon-wh/2,1,wh);
    }
    ctx.fillStyle="rgba(0,0,0,.12)";
    ctx.fillRect(x,horizon-wh/2+wh*.49,step+1,2);
  }

  const entities=bots.filter(b=>b.alive).sort((a,b)=>dist(player,b)-dist(player,a));
  for(const e of entities){
    const d=dist(player,e);
    const da=norm(angle(player,e)-player.a);
    if(Math.abs(da)>FOV*.68) continue;
    const sx=w/2+(da/FOV)*w;
    const sz=Math.min(h*.72,17000/Math.max(d,1));

    if(los(player,e)){
      const baseY=horizon+sz*.45;
      const main=e.team===1?"#8b4545":"#426d91";
      const dark=e.team===1?"#542b2b":"#263f55";
      const vest=e.team===1?"#756467":"#687984";
      const patch=e.team===1?"#d27676":"#72b8e8";

      // legs + boots
      ctx.fillStyle=dark;
      ctx.fillRect(sx-sz*.17,baseY-sz*.38,sz*.13,sz*.34);
      ctx.fillRect(sx+sz*.04,baseY-sz*.38,sz*.13,sz*.34);
      ctx.fillStyle="#17191a";
      ctx.fillRect(sx-sz*.19,baseY-sz*.07,sz*.16,sz*.08);
      ctx.fillRect(sx+sz*.03,baseY-sz*.07,sz*.16,sz*.08);

      // torso + armor
      ctx.fillStyle=main;
      ctx.fillRect(sx-sz*.23,baseY-sz*.86,sz*.46,sz*.48);
      ctx.fillStyle=vest;
      ctx.fillRect(sx-sz*.16,baseY-sz*.79,sz*.32,sz*.27);
      ctx.fillStyle="#222628";
      ctx.fillRect(sx-sz*.13,baseY-sz*.70,sz*.08,sz*.10);
      ctx.fillRect(sx+sz*.05,baseY-sz*.70,sz*.08,sz*.10);

      // arms
      ctx.fillStyle=main;
      ctx.fillRect(sx-sz*.31,baseY-sz*.80,sz*.10,sz*.35);
      ctx.fillRect(sx+sz*.21,baseY-sz*.80,sz*.10,sz*.35);

      // rifle
      ctx.fillStyle="#25292b";
      ctx.fillRect(sx-sz*.23,baseY-sz*.57,sz*.47,sz*.07);
      ctx.fillStyle="#747c7f";
      ctx.fillRect(sx+sz*.12,baseY-sz*.55,sz*.25,sz*.025);
      ctx.fillStyle="#111";
      ctx.fillRect(sx-sz*.03,baseY-sz*.50,sz*.07,sz*.10);

      // head + helmet + visor
      ctx.fillStyle="#b99073";
      ctx.fillRect(sx-sz*.15,baseY-sz*1.17,sz*.30,sz*.22);
      ctx.fillStyle=dark;
      ctx.fillRect(sx-sz*.18,baseY-sz*1.22,sz*.36,sz*.12);
      ctx.fillRect(sx-sz*.15,baseY-sz*1.13,sz*.30,sz*.055);
      ctx.fillStyle="#15191b";
      ctx.fillRect(sx-sz*.13,baseY-sz*1.105,sz*.26,sz*.045);

      // team patch
      ctx.fillStyle=patch;
      ctx.fillRect(sx-sz*.29,baseY-sz*.75,sz*.055,sz*.07);
    }

    if(espOn && e.team===1){
      ctx.strokeStyle="#ff3939";
      ctx.lineWidth=2;
      ctx.strokeRect(sx-sz*.26,horizon-sz*.68,sz*.52,sz*1.20);
      ctx.fillStyle="white";
      ctx.font="12px Arial";
      ctx.fillText(`${e.name} ${Math.max(0,e.hp)}HP`,sx-sz*.28,horizon-sz*.73);
    }
  }


  // blood hit particles on characters
  for(const p of bloodFx){
    const dx=p.x-player.x,dy=p.y-player.y,d=Math.hypot(dx,dy);
    if(d<7) continue;
    const da=norm(Math.atan2(dy,dx)-player.a);
    if(Math.abs(da)<FOV*.58){
      const sx=w/2+(da/(FOV/2))*w/2;
      const sy=horizon-(Math.min(1800/d,80)*.35);
      const r=Math.max(1.5,Math.min(7,420/d))*Math.min(1,p.life*5);
      ctx.fillStyle=`rgba(125,12,12,${Math.min(.95,p.life*3)})`;
      ctx.beginPath();ctx.arc(sx,sy,r,0,TWO_PI);ctx.fill();
    }
  }

  // crossbow bolts / impact sparks in world
  for(const b of bolts){
    const dx=b.x-player.x, dy=b.y-player.y;
    const d=Math.hypot(dx,dy);
    const da=norm(Math.atan2(dy,dx)-player.a);
    if(Math.abs(da)<FOV*.58 && d>8){
      const sx=w/2+(da/(FOV/2))*w/2;
      const sy=horizon;
      const size=Math.max(2,Math.min(18,900/d));
      ctx.save();
      ctx.translate(sx,sy);
      ctx.rotate(da*1.5);
      ctx.fillStyle="#d5d0b7";
      ctx.fillRect(-size*.65,-1,size*1.3,2);
      ctx.fillStyle="#6f4d2d";
      ctx.fillRect(-size*.95,-1,size*.35,2);
      ctx.restore();
    }
  }
  for(const s of impacts){
    const dx=s.x-player.x,dy=s.y-player.y,d=Math.hypot(dx,dy);
    const da=norm(Math.atan2(dy,dx)-player.a);
    if(Math.abs(da)<FOV*.58&&d>6){
      const sx=w/2+(da/(FOV/2))*w/2;
      const sy=horizon;
      const r=Math.max(2,Math.min(10,500/d))*Math.min(1,s.life*5);
      ctx.fillStyle="rgba(255,220,140,.8)";
      ctx.fillRect(sx-r,sy-1,r*2,2);
      ctx.fillRect(sx-1,sy-r,2,r*2);
    }
  }

  // detailed weapon view models
  const kickY = recoilKick*34;
  const kickX = recoilSide*w*1.7;
  ctx.save();
  ctx.translate(kickX,kickY);

  if(player.weapon===0){
    // AR: receiver, rail, handguard, barrel, sights, mag, stock
    ctx.fillStyle="#171a1c";ctx.fillRect(w*.38,h*.815,w*.27,h*.072);
    ctx.fillStyle="#3e464a";ctx.fillRect(w*.455,h*.755,w*.235,h*.055);
    ctx.fillStyle="#697276";ctx.fillRect(w*.49,h*.742,w*.155,h*.012);
    for(let i=0;i<6;i++){ctx.fillStyle="#202426";ctx.fillRect(w*(.50+i*.023),h*.767,w*.010,h*.022);}
    ctx.fillStyle="#747d80";ctx.fillRect(w*.68,h*.766,w*.12,h*.016);
    ctx.fillStyle="#111416";ctx.fillRect(w*.795,h*.77,w*.055,h*.009);
    ctx.fillStyle="#0d0f10";ctx.fillRect(w*.525,h*.708,w*.018,h*.047);
    ctx.fillRect(w*.635,h*.718,w*.015,h*.038);
    ctx.strokeStyle="#81898c";ctx.lineWidth=2;ctx.strokeRect(w*.553,h*.711,w*.043,h*.026);
    ctx.fillStyle="#202527";ctx.beginPath();ctx.moveTo(w*.525,h*.865);ctx.lineTo(w*.585,h*.865);ctx.lineTo(w*.57,h*.985);ctx.lineTo(w*.535,h*.97);ctx.closePath();ctx.fill();
    ctx.fillStyle="#24292c";ctx.fillRect(w*.39,h*.855,w*.10,h*.045);
    ctx.fillStyle="#444";ctx.fillRect(w*.46,h*.89,w*.105,h*.07);
  }else if(player.weapon===1){
    // Pistol: slide, ejection port, front/rear sights, trigger guard, grip
    ctx.fillStyle="#60696d";ctx.fillRect(w*.50,h*.785,w*.155,h*.052);
    ctx.fillStyle="#899195";ctx.fillRect(w*.515,h*.79,w*.06,h*.012);
    ctx.fillStyle="#111";ctx.fillRect(w*.565,h*.789,w*.045,h*.012);
    ctx.fillStyle="#202426";ctx.fillRect(w*.535,h*.835,w*.075,h*.135);
    ctx.strokeStyle="#3b4144";ctx.lineWidth=3;ctx.strokeRect(w*.54,h*.84,w*.06,h*.06);
    ctx.fillStyle="#111";ctx.fillRect(w*.515,h*.77,w*.014,h*.016);ctx.fillRect(w*.63,h*.77,w*.012,h*.016);
    ctx.fillStyle="#151819";ctx.fillRect(w*.645,h*.798,w*.055,h*.014);
    for(let i=0;i<4;i++){ctx.fillStyle="#3c4244";ctx.fillRect(w*.55,h*(.875+i*.02),w*.045,h*.008);}
  }else if(player.weapon===2){
    // Knife: bevel + fuller + guard + wrapped handle
    ctx.fillStyle="#c9ced0";ctx.beginPath();ctx.moveTo(w*.47,h*.86);ctx.lineTo(w*.735,h*.66);ctx.lineTo(w*.585,h*.895);ctx.closePath();ctx.fill();
    ctx.strokeStyle="#7b8386";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(w*.515,h*.845);ctx.lineTo(w*.69,h*.705);ctx.stroke();
    ctx.fillStyle="#555d60";ctx.fillRect(w*.45,h*.858,w*.155,h*.035);
    ctx.fillStyle="#171a1b";ctx.fillRect(w*.405,h*.895,w*.14,h*.065);
    for(let i=0;i<5;i++){ctx.fillStyle="#454b4e";ctx.fillRect(w*(.415+i*.023),h*.9,w*.010,h*.055);}
  }else if(player.weapon===3){
    // Pump shotgun: barrel, tube, receiver, shell port, pump ribs, stock
    ctx.fillStyle="#1c2022";ctx.fillRect(w*.34,h*.83,w*.31,h*.067);
    ctx.fillStyle="#596164";ctx.fillRect(w*.49,h*.76,w*.32,h*.023);
    ctx.fillStyle="#343a3d";ctx.fillRect(w*.50,h*.79,w*.28,h*.016);
    ctx.fillStyle="#111416";ctx.fillRect(w*.805,h*.764,w*.07,h*.012);
    ctx.fillStyle="#72513a";ctx.fillRect(w*.485,h*.82,w*.13,h*.058);
    for(let i=0;i<5;i++){ctx.fillStyle="#3b2b20";ctx.fillRect(w*(.495+i*.022),h*.826,w*.010,h*.046);}
    ctx.fillStyle="#2d3234";ctx.fillRect(w*.39,h*.79,w*.12,h*.055);
    ctx.fillStyle="#9a7047";ctx.fillRect(w*.405,h*.804,w*.045,h*.012);
    ctx.fillStyle="#33251c";ctx.beginPath();ctx.moveTo(w*.34,h*.855);ctx.lineTo(w*.43,h*.855);ctx.lineTo(w*.37,h*.95);ctx.lineTo(w*.31,h*.94);ctx.closePath();ctx.fill();
  }else{
    // Crossbow: stock, rail, limbs, string, loaded bolt, optic
    ctx.fillStyle="#33261e";ctx.fillRect(w*.405,h*.84,w*.255,h*.055);
    ctx.fillStyle="#5e676a";ctx.fillRect(w*.49,h*.772,w*.23,h*.025);
    ctx.fillStyle="#1b1f21";ctx.fillRect(w*.52,h*.725,w*.085,h*.038);
    ctx.strokeStyle="#8c9699";ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(w*.35,h*.79);ctx.quadraticCurveTo(w*.56,h*.68,w*.77,h*.79);ctx.stroke();
    ctx.strokeStyle="#d2d1c7";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(w*.35,h*.79);ctx.lineTo(w*.77,h*.79);ctx.stroke();
    ctx.fillStyle="#d8d2b7";ctx.fillRect(w*.55,h*.755,w*.23,h*.007);
    ctx.fillStyle="#795333";ctx.beginPath();ctx.moveTo(w*.78,h*.758);ctx.lineTo(w*.805,h*.758);ctx.lineTo(w*.79,h*.748);ctx.closePath();ctx.fill();
    ctx.fillStyle="#171a1b";ctx.beginPath();ctx.moveTo(w*.47,h*.88);ctx.lineTo(w*.535,h*.88);ctx.lineTo(w*.515,h*.985);ctx.lineTo(w*.48,h*.97);ctx.closePath();ctx.fill();
    ctx.fillStyle="#241b17";ctx.fillRect(w*.405,h*.89,w*.09,h*.04);
  }

  if(muzzleFlash>0 && player.weapon!==2 && player.weapon!==4){
    const mx=player.weapon===3?w*.82:w*.775;
    const my=player.weapon===3?h*.765:h*.755;
    const f=9+Math.random()*14;
    ctx.fillStyle="rgba(255,226,125,.92)";
    ctx.beginPath();
    ctx.moveTo(mx-f,my);ctx.lineTo(mx+f,my-f*.45);ctx.lineTo(mx+f*.25,my);
    ctx.lineTo(mx+f,my+f*.45);ctx.closePath();ctx.fill();
  }
  ctx.restore();

  if(hitMarker>0){
    const cx=w/2,cy=h/2;
    ctx.strokeStyle=`rgba(255,255,255,${Math.min(1,hitMarker*10)})`;
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(cx-12,cy-12);ctx.lineTo(cx-5,cy-5);
    ctx.moveTo(cx+12,cy-12);ctx.lineTo(cx+5,cy-5);
    ctx.moveTo(cx-12,cy+12);ctx.lineTo(cx-5,cy+5);
    ctx.moveTo(cx+12,cy+12);ctx.lineTo(cx+5,cy+5);
    ctx.stroke();
  }

  ui.topInfo.textContent=`BLUE ${scoreB} : ${scoreR} RED`;
  ui.hp.textContent=`HEALTH ${Math.max(0,player.hp)}`;
  const hbFill=document.getElementById("healthBarFill");
  const hbValue=document.getElementById("healthBarValue");
  if(hbFill) hbFill.style.width=`${Math.max(0,Math.min(100,player.hp))}%`;
  if(hbValue) hbValue.textContent=Math.max(0,Math.ceil(player.hp));
  const dn=document.getElementById("deathNotice");
  if(dn) dn.style.display=(!player.alive && !roundOver)?"block":"none";
  const wp=WEAPONS[player.weapon];
  ui.ammo.textContent=player.weapon===2?`${wp.name} ∞`:`${wp.name} ${player.ammo[player.weapon]} / ${wp.mag}`;
  ui.kd.textContent=`K/D ${player.kills} / ${player.deaths}`;
  ui.aimState.textContent=`F1 AIM ${aimOn?"ON":"OFF"}`;
  ui.aimState.classList.toggle("cheatOn",aimOn);
  ui.espState.textContent=`F2 ESP ${espOn?"ON":"OFF"}`;
  ui.espState.classList.toggle("cheatOn",espOn);
}

function bindStick(id,state){
  const el=$(id),knob=el.querySelector(".stickKnob");
  let pid=null;
  function upd(e){
    const r=el.getBoundingClientRect();
    let dx=e.clientX-r.left-r.width/2;
    let dy=e.clientY-r.top-r.height/2;
    const m=r.width*.31;
    const l=Math.hypot(dx,dy)||1;
    if(l>m){dx*=m/l;dy*=m/l;}
    state.x=dx/m;state.y=dy/m;
    knob.style.transform=`translate(${dx}px,${dy}px)`;
  }
  el.addEventListener("pointerdown",e=>{
    pid=e.pointerId;
    el.setPointerCapture?.(pid);
    upd(e);
  });
  el.addEventListener("pointermove",e=>{if(e.pointerId===pid)upd(e)});
  function end(e){
    if(e.pointerId!==pid)return;
    pid=null;state.x=state.y=0;knob.style.transform="";
  }
  el.addEventListener("pointerup",end);
  el.addEventListener("pointercancel",end);
}
bindStick("moveStick",moveJoy);

if(TOUCH){
  let touchStartX=0, touchStartY=0, touchStartTime=0, touchDragged=false;

  canvas.addEventListener("pointerdown",e=>{
    if(!running || e.clientX < innerWidth*.30) return;
    touchLookId=e.pointerId;
    touchLookX=e.clientX; touchLookY=e.clientY;
    touchStartX=e.clientX; touchStartY=e.clientY;
    touchStartTime=performance.now();
    touchDragged=false;
    canvas.setPointerCapture?.(e.pointerId);
    e.preventDefault();
  });

  canvas.addEventListener("pointermove",e=>{
    if(e.pointerId!==touchLookId) return;
    const dx=e.clientX-touchLookX;
    const dy=e.clientY-touchLookY;
    touchLookX=e.clientX; touchLookY=e.clientY;

    if(Math.hypot(e.clientX-touchStartX,e.clientY-touchStartY)>8) touchDragged=true;

    if(!aimOn){
      player.a += dx*.0042;
      recoilPitch = Math.max(-.11, Math.min(.16, recoilPitch + dy*.00022));
    }
    e.preventDefault();
  });

  const endLook=e=>{
    if(e.pointerId!==touchLookId) return;

    const elapsed=performance.now()-touchStartTime;
    const moved=Math.hypot(e.clientX-touchStartX,e.clientY-touchStartY);

    // 짧은 탭 = 1발. 드래그 = 시점 회전.
    if(running && !touchDragged && moved<10 && elapsed<350){
      shoot(player,player.weapon);
    }

    touchLookId=null;
    e.preventDefault();
  };

  canvas.addEventListener("pointerup",endLook);
  canvas.addEventListener("pointercancel",e=>{
    if(e.pointerId===touchLookId) touchLookId=null;
    e.preventDefault();
  });

  // iOS/Safari의 연속 탭 확대 제스처 차단.
  canvas.addEventListener("dblclick",e=>e.preventDefault());
  document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
  document.addEventListener("gesturechange",e=>e.preventDefault(),{passive:false});
  document.addEventListener("gestureend",e=>e.preventDefault(),{passive:false});
}
document.querySelectorAll(".weapon").forEach(b=>{
  b.addEventListener("pointerdown",e=>{
    e.preventDefault();
    selectWeapon(Number(b.dataset.w));
  });
});

addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;
  if(["1","2","3","4","5"].includes(e.key))selectWeapon(Number(e.key)-1);
  if(e.key.toLowerCase()==="r")reload();
  if(e.key==="F1"){e.preventDefault();toggleAim();}
  if(e.key==="F2"){e.preventDefault();toggleEsp();}
});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});

if(!TOUCH){
  canvas.addEventListener("click",()=>{if(running)canvas.requestPointerLock?.()});
  addEventListener("mousemove",e=>{
    if(document.pointerLockElement===canvas && !aimOn){
      player.a += e.movementX*.0027;
      recoilPitch = Math.max(-.11, Math.min(.16, recoilPitch + e.movementY*.00018));
    }
  });
  addEventListener("mousedown",e=>{if(e.button===0&&running)firing=true});
  addEventListener("mouseup",e=>{if(e.button===0)firing=false});
}

ui.reload.addEventListener("click",reload);
ui.aim.addEventListener("click",toggleAim);
ui.esp.addEventListener("click",toggleEsp);

function loop(now){
  const dt=Math.min(.033,(now-last)/1000);
  last=now;
  gameTime+=dt;
  if(running){
    if(roundOver && roundRestartAt && gameTime>=roundRestartAt){
      roundRestartAt=0;
      beginNextRound();
    }
    if(!roundOver){
      updatePlayer(dt);
      updateBots(dt);
      updateProjectiles(dt);
      updateBloodFx(dt);
      checkRoundEnd();
    }
  }
  renderWorld();
  requestAnimationFrame(loop);
}
updateRoundHud();
requestAnimationFrame(loop);
</script>
</body>
</html>
