<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#15191c">
  <title>Cheat Arena</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <canvas id="game" aria-label="Cheat Arena game canvas"></canvas>

  <section id="mainMenu" class="panel menu-panel">
    <h1>CHEAT ARENA</h1>
    <p class="subtitle">3 VS 3 FPS PROTOTYPE</p>
    <button id="aiModeBtn" class="menu-btn primary">AI전 시작</button>
    <button id="onlineModeBtn" class="menu-btn">온라인 3v3</button>
    <button id="settingsBtn" class="menu-btn">설정</button>
    <p id="onlineState" class="small-text">온라인 서버: 미설정</p>
  </section>

  <section id="settingsPanel" class="panel hidden">
    <h2>설정</h2>
    <label>
      마우스/터치 감도
      <input id="sensitivity" type="range" min="0.4" max="2.2" step="0.1" value="1">
    </label>
    <label>
      HUD 크기
      <input id="hudScale" type="range" min="0.75" max="1.25" step="0.05" value="1">
    </label>
    <button id="settingsClose" class="menu-btn primary">완료</button>
  </section>

  <div id="topWeaponHud" class="weapon-hud hidden" aria-label="무기 선택">
    <button class="weapon-slot active" data-weapon="0">
      <span class="number">1</span><span class="weapon-symbol">▰</span><span>AR</span>
    </button>
    <button class="weapon-slot" data-weapon="1">
      <span class="number">2</span><span class="weapon-symbol">⌐</span><span>PISTOL</span>
    </button>
    <button class="weapon-slot" data-weapon="2">
      <span class="number">3</span><span class="weapon-symbol">╱</span><span>KNIFE</span>
    </button>
  </div>

  <div id="statusHud" class="hidden">
    <div id="scoreText">BLUE 0 : 0 RED</div>
    <div id="roundText">ROUND 1</div>
    <div id="healthText">HEALTH 100</div>
    <div id="ammoText">AR · 30 / 30</div>
    <div id="cheatText">AIM OFF · ESP OFF</div>
    <div id="kdText">K/D 0/0</div>
  </div>

  <div id="killFeed"></div>
  <div id="crosshair" class="hidden"></div>
  <div id="deviceBadge"></div>
  <div id="toast"></div>

  <div id="touchControls" class="hidden">
    <div id="movePad" class="pad"><div class="knob"></div><span>MOVE</span></div>
    <div id="lookPad" class="pad"><div class="knob"></div><span>LOOK</span></div>
    <button id="fireBtn" class="touch-btn fire">FIRE</button>
    <button id="reloadBtn" class="touch-btn reload">R</button>
    <button id="aimBtn" class="touch-btn cheat aim">AIM</button>
    <button id="espBtn" class="touch-btn cheat esp">ESP</button>
    <button id="menuBtn" class="touch-btn menu">☰</button>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/platform.js"></script>
  <script src="./js/net.js"></script>
  <script src="./js/game.js"></script>
</body>
</html>
